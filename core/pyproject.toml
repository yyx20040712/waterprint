[project]
name = "waterprint-core"
version = "0.1.0"
description = "WaterPrint 计算内核（纯 Python，零框架依赖，不知道 HTTP 与 React 的存在）"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "pint>=0.24",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "ezdxf>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "hypothesis>=6.108",
    "syrupy>=4.7",
    "pytest-benchmark>=4.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "types-openpyxl>=3.1",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# 镜像源（本机网络实测 2026-08：PyPI 直连/清华源断流，阿里云源可稳定续传；
# 仓库级配置让 uv sync 开箱即用。CI（GitHub 云端）网络良好，此配置无副作用；
# 个人想改回官方源：删本节或设 UV_DEFAULT_INDEX 环境变量覆盖。）
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["waterprint"]

[tool.pytest.ini_options]
# tests/ 镜像测试 + units_lib 单元包内测试（M0.5 接线：包内测试随交付编写即被收集）
testpaths = ["tests", "waterprint/units_lib"]
# 收集口径对齐宪法 §6"性质测试常驻"：tests/ 下 properties_*.py 与包内 properties.py
# （AGENTS §11 固定结构命名）均纳入收集——T1 审计发现默认 test_*.py/*_test.py
# 模式漏收性质测试（全量从未运行它们），总控裁决补齐（commit 3）。
python_files = ["test_*.py", "properties_*.py", "properties.py"]
pythonpath = ["."]
# --import-mode=importlib：允许 32 个单元包同名 tests/test_compute.py 并存收集
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "arch: 架构与门禁自检测试（始终激活，骨架期即运行）",
    "golden: 依赖 golden_data 数据文件的端到端测试（数据未整理时自动跳过）",
]

[tool.coverage.run]
source = ["waterprint"]
omit = ["*/tests/*"]  # 单元包内测试不计入覆盖率分母（防失真）

[tool.coverage.report]
# fail_under=2026-09-02 全量实测基线下取整（防回退门），提值挂沿册
# （实测精确 87.87%=8003/9108 语句，下取整=87——R-1 裁决改准：88 为
# 四舍五入值超「下取整」口径；留 0.87pp 余量兼顾本地 Windows 与 CI
# ubuntu 平台分支覆盖差，87.87>87 仍真门禁）。
# 门禁只在 CI 面（ci.yml core job pytest --cov，R2-B 接线）：本地
# addopts 不加 --cov——本地全量零 cov 拖慢（裁决注记，非遗漏）。
fail_under = 87
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = [
    "E", "F", "W",      # pycodestyle / pyflakes
    "I",                # import 排序
    "N",                # 命名
    "UP",               # 现代化
    "B",                # bugbear
    "C4",               # 推导式
    "SIM",              # 简化
    "PL",               # pylint 规则族（含复杂度预算）
    "SLF001",           # 跨包私有访问
    "RUF",
]
# 中文项目策略（T0.2）：RUF001/2/3 把全角中文标点（，。：；""——等）判为歧义 unicode
# 字符——全角中文标点是本项目文档字符串、注释与用户可见字符串的规范写法（AGENTS.md §3
# UTF-8 纪律），非歧义字符，项目级豁免；select 保留 "RUF"，其余 RUF 规则继续生效。
ignore = [
    "RUF001", # 字符串字面量中的全角中文标点：规范写法，非歧义
    "RUF002", # 文档字符串中的全角中文标点：同上
    "RUF003", # 注释中的全角中文标点：同上
]
# 复杂度预算（重写计划 §13.7，无豁免清单；超标拆文件而不是加 ignore）
[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 40
max-args = 5
max-branches = 12

[tool.ruff.lint.per-file-ignores]
# 测试期望值允许具体数字（唯一合法来源：docs/norms 手算对照表）
# 锁定测试区工具债豁免（T0.2，AGENTS.md §7：core/tests/ 只读锁定，AI 禁改）：
# 以下追加规则的命中全部是锁定测试的存量样式债（RUF043/B017/B009/E501/PLC0415/
# UP037/F401/F541/RUF017/RUF059，2026-08-23 实测 50 条：RUF043×20/PLC0415×9/
# B009×6/E501×5/B017×4/UP037×2/F401/F541/RUF017/RUF059 各 1），待人类解锁流程
# 修复——本豁免只为让 CI 可运转，不是认可这些债。
# 历史注记：F821 曾在列（tests/contracts/test_condition.py 引用未定义
# condition_set×2，台账在册真缺陷），已由 U-A 批修复（a86421f）并于 SENS 批
# S1 核实全 tests 零命中后出列（用户总授权 2026-08-23）。
"tests/**" = [
    "PLR2004",
    "RUF043", "B017", "E501", "PLC0415", "B009", "UP037", "F401", "F541",
    "RUF017", "RUF059",
]
"waterprint/units_lib/**/tests/**" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["waterprint"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "waterprint"
# 外部包禁令开关（T0.2）：下方 pint 契约 forbidden_modules=["pint"] 禁的是外部包，
# import-linter 要求根级显式 include_external_packages=True，否则报
# "The top level configuration must have include_external_packages=True when
#  there are external forbidden modules"（工具链首跑实测，CI 首日必炸）。
include_external_packages = true

# L4 子层化（D-23 文档侧 / 修复轮 1 机器侧）：import-linter 同条目内 "|"
# 兄弟互相 import 亦被禁止，单行四兄弟会误杀 cli→app 合法边；拆为三行子层
# cli → app|app_enumeration → project|trace（SERVER D1 2026-08-26：app 与
# app_enumeration 同层伴生并列——app 再导出保持 server 单入口；方向单一
# app→app_enumeration 防环由伴生件规格头【依赖足迹】承载，该唯一边经
# 下方 ignore_imports 显式豁免登记，反向 app_enumeration→app 仍被禁）。
[[tool.importlinter.contracts]]
name = "内核分层只许向下（L4.cli→L4.app→L4.project-trace→L3→L2→L1→L0）"
type = "layers"
layers = [
    "waterprint.cli",
    "waterprint.app | waterprint.app_enumeration",
    "waterprint.project | waterprint.trace",
    "waterprint.graph | waterprint.solution | waterprint.elevation | waterprint.cost | waterprint.drafting | waterprint.geometry | waterprint.network",
    "waterprint.units_lib",
    "waterprint.registry",
    "waterprint.contracts",
]
# SERVER D1 同层伴生唯一边豁免："|" 兄弟互相 import 默认禁止——app.py 对
# 伴生件的再导出 import 是规格允许边，登记于此接受审查（同款"意图忠实
# 执行"条款先例=下方 pint 契约 allow_indirect_imports）。
ignore_imports = ["waterprint.app -> waterprint.app_enumeration"]

[[tool.importlinter.contracts]]
name = "L3 子系统互相独立（只消费 L0 结果契约，互不感知）"
type = "independence"
modules = [
    "waterprint.graph",
    "waterprint.solution",
    "waterprint.elevation",
    "waterprint.cost",
    "waterprint.drafting",
    "waterprint.geometry",
    "waterprint.network",
]

# 逐包列出全部 32 个单元包（DS-01 裁决：线级粒度拦不住同线互 import）；
# 顺序同 docs/structure-graph.md §3：municipal 13 → mine_water 8 → sludge 7 → conveyance 4。
# 包集与目录实际单元包的双向一致性由 scripts/check_module_graph.py 校验（漏列/多列 = 门禁 FAIL）。
[[tool.importlinter.contracts]]
name = "工艺单元包互相独立（32 包逐包强制，加一个单元永不牵动别人）"
type = "independence"
modules = [
    "waterprint.units_lib.municipal.cugeshan",
    "waterprint.units_lib.municipal.xigeshan",
    "waterprint.units_lib.municipal.chenshachi",
    "waterprint.units_lib.municipal.chuchenchi",
    "waterprint.units_lib.municipal.tiaojiechi",
    "waterprint.units_lib.municipal.aao",
    "waterprint.units_lib.municipal.cass",
    "waterprint.units_lib.municipal.gaomidu",
    "waterprint.units_lib.municipal.vxinglvchi",
    "waterprint.units_lib.municipal.ziwai",
    "waterprint.units_lib.municipal.erchunchi",
    "waterprint.units_lib.municipal.bashi_jiliangcao",
    "waterprint.units_lib.municipal.wushui_tisheng",
    "waterprint.units_lib.mine_water.input",
    "waterprint.units_lib.mine_water.tiaojiechi",
    "waterprint.units_lib.mine_water.chenshachi",
    "waterprint.units_lib.mine_water.ningjiao",
    "waterprint.units_lib.mine_water.cifenli",
    "waterprint.units_lib.mine_water.gaomidu",
    "waterprint.units_lib.mine_water.vxinglvchi",
    "waterprint.units_lib.mine_water.ziwai",
    "waterprint.units_lib.sludge.hebing",
    "waterprint.units_lib.sludge.shusong",
    "waterprint.units_lib.sludge.bengzhan",
    "waterprint.units_lib.sludge.nongsuo",
    "waterprint.units_lib.sludge.xiaohua",
    "waterprint.units_lib.sludge.tuoshui",
    "waterprint.units_lib.sludge.ganhua",
    "waterprint.units_lib.conveyance.jishuijing",
    "waterprint.units_lib.conveyance.peishuijing",
    "waterprint.units_lib.conveyance.jipeishuijing",
    "waterprint.units_lib.conveyance.peishuiqu",
]

[[tool.importlinter.contracts]]
name = "装配点唯一：图引擎与各子系统不认识任何具体单元"
type = "forbidden"
# ARCH1 D6(h)（2026-08-24）：source_modules += waterprint.network——AGENTS §1
# "network/ 不共享厂区图引擎"，装配点唯一约束本就覆盖 L3 全子系统，此前
# 独缺 network 行（network 无代码，契约恒 KEPT；补行=口径完备，非行为）。
source_modules = [
    "waterprint.graph",
    "waterprint.solution",
    "waterprint.elevation",
    "waterprint.cost",
    "waterprint.drafting",
    "waterprint.geometry",
    "waterprint.network",
]
forbidden_modules = ["waterprint.units_lib"]

[[tool.importlinter.contracts]]
name = "pint 只许在 contracts.quantity 边界包装中出现（ADR-002）"
type = "forbidden"
# allow_indirect_imports（T3 实现期裁决 2026-08-23，待总控追认）：
# import-linter forbidden 契约默认检查间接链（allow_indirect_imports=false），
# 而 DimKey/CANONICAL_UNITS 位于 quantity（唯一 pint 接触点）且是全库 L0 基座——
# 间接口径将禁止一切上层 import 任何经 quantity 的契约（含图谱 §1b 已声明边
# registry→contracts，T3 dimensions 首次触雷：dimensions→manifest→quantity→pint
# 三跳即 BROKEN，实测复现）。ADR-002 意图是"pint 只许 quantity 直接使用"，
# 直查口径（true）忠实执行该意图：任何 source 模块直接 import pint 仍即 FAIL，
# 经 quantity 的类型面引用不构成 pint 泄漏（pint 对象不出 quantity 边界，
# quantity.py R2 既有语义）。
allow_indirect_imports = true
source_modules = [
    "waterprint.graph",
    "waterprint.solution",
    "waterprint.elevation",
    "waterprint.cost",
    "waterprint.drafting",
    "waterprint.geometry",
    "waterprint.network",
    "waterprint.units_lib",
    "waterprint.registry",
    "waterprint.project",
    "waterprint.trace",
    "waterprint.app",
    "waterprint.cli",
]
forbidden_modules = ["pint"]
