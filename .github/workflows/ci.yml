# CI —— 全链路门禁（重写计划 §6/§13.7；与本地 scripts/run_gates.py 同口径）
#
# 激活节奏（ENG2 D1 2026-08-27 常驻面收口）：
#   - gates / core / server / webapp / benchmarks：全部生效；
#   - benchmarks：§18.1 预算 5s 不放宽；慢机敏感性=CI 偶发红按重跑
#     复核定性（非放宽——交接在册口径）；
#   - contract-drift：仍注释态（ENG2 BLOCKED 未启用——BASE 实测重生成
#     OpenAPI 与入库件存在漂移，重导 openapi.json 超出 ENG2 白名单；
#     待总控裁决后按下文注释块步骤启用）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  # CI 在 GitHub 海外 runner 上：覆盖 pyproject 内的阿里云镜像（本机网络对策），
  # 走官方 PyPI——UV_DEFAULT_INDEX 优先于 [[tool.uv.index]] default（README 既定开关）
  UV_DEFAULT_INDEX: "https://pypi.org/simple"

jobs:
  gates:
    name: 架构门禁（零依赖，系统 Python）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python scripts/run_gates.py

  core:
    name: 内核质量（ruff/mypy/import-linter/pytest）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖（core/uv.lock 入库——frozen 安装不重解析）
        run: uv sync --frozen
      - name: Ruff（零告警）
        run: uv run ruff check .
      - name: Mypy strict
        run: uv run mypy
      - name: import-linter 架构契约
        run: uv run lint-imports
      - name: Pytest（骨架期：收集+架构测试须绿；M1 起全量+覆盖率门禁）
        run: uv run pytest -m arch
      # M1 起替换上行（coverage 95 门禁在 pyproject 中启用）：
      #   uv run pytest --cov --cov-report=term-missing

  server:
    name: 服务层质量
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: 安装依赖（server/uv.lock 入库——ENG1 遗留收口 SERVER D6：frozen 安装不重解析）
        run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - name: import-linter 架构契约（UF-13 机器强制 CI 化——ENG2 D1）
        run: uv run lint-imports
      - run: uv run pytest

  webapp:
    name: 前端构建（类型检查）
    runs-on: ubuntu-latest
    env:
      # 仓库 .npmrc 的 npmmirror 是本机网络对策；CI 海外 runner 走官方源
      npm_config_registry: "https://registry.npmjs.org"
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  benchmarks:
    name: 性能基准（§18.1 预算 5s 不放宽）
    needs: [gates, core]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: 安装依赖（core/uv.lock 入库——frozen 安装不重解析；dev 组含 pytest-benchmark）
        run: uv sync --frozen
      - name: Pytest 基准（慢机敏感性：CI 偶发红按重跑复核定性——非放宽，交接在册口径）
        run: uv run pytest tests/benchmark -q

  # contract-drift（ENG2 D1 拟常驻——BLOCKED 未落，待总控裁决）：
  #   BASE 实测（2026-08-27）：dump_openapi 重生成件与入库件字节比对存在
  #   漂移——入库件（3a66049 生成）缺 TaskStatus.properties/error_code 字段
  #   （bd136fc R1-2/AU-2 接线后未重导）。重生成 openapi.json 属"禁手改、
  #   只经 dump_openapi 入库"生成物，但该文件在 ENG2 §2 禁改清单——需
  #   总控显式授权后方可：1) uv run python -m waterprint_server.dump_openapi
  #   重新入库；2) server job pytest 后增字节比对步（不一致=退出码 1，
  #   中文报错"OpenAPI 契约漂移：重生成与入库件不一致，请经
  #   dump_openapi 重新入库"）。
