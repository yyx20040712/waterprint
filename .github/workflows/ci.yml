# CI —— 全链路门禁（重写计划 §6/§13.7；与本地 scripts/run_gates.py 同口径）
#
# 激活节奏（ENG2 D1 2026-08-27 常驻面收口；R1-a 同日收口）：
#   - gates / core / server / webapp / benchmarks：全部生效；
#   - benchmarks：§18.1 预算 5s 不放宽；慢机敏感性=CI 偶发红按重跑
#     复核定性（非放宽——交接在册口径）；
#   - contract-drift：server job 内常驻（R1-a 裁决重导修正 bd136fc 遗留
#     漂移后启用——重生成 OpenAPI 与入库件字节比对）；
#   - dep-audit（WP3·外审整改#5 L4）：依赖审计阻断面——R2-B 门禁化
#     收口：审计红即阻断 run 结论（continue-on-error 已移除）。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  # CI 在 GitHub 海外 runner 上：覆盖 pyproject 内的阿里云镜像（本机网络对策），
  # 走官方 PyPI——UV_DEFAULT_INDEX 优先于 [[tool.uv.index]] default（README 既定开关）
  UV_DEFAULT_INDEX: "https://pypi.org/simple"

jobs:
  gates:
    name: 架构门禁（零依赖，系统 Python）
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 全量历史——check_trust_root 需解析 push/PR range
      # （GITHUB_SHA/GITHUB_ACTIONS 为 Actions 原生 env 免映射；
      # GITHUB_EVENT_BEFORE 取自 push event payload、GITHUB_PR_BASE 取自
      # pull_request event 的 base sha——均需显式传入，非对应事件时为空）
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/run_gates.py
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_PR_BASE: ${{ github.event.pull_request.base.sha }}

  core:
    name: 内核质量（ruff/mypy/import-linter/pytest）
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: 安装依赖（core/uv.lock 入库——frozen 安装不重解析）
        run: uv sync --frozen
      - name: Ruff（零告警）
        run: uv run ruff check .
      - name: Mypy strict
        run: uv run mypy
      - name: import-linter 架构契约
        run: uv run lint-imports
      - name: Pytest（全量：tests + units_lib——与本地口径/门禁基线一致，WP3·M8）
        run: uv run pytest tests waterprint/units_lib --cov
      # 覆盖率门禁（R2-B 真门禁化，core 面先行）：fail_under 取值与裁决
      # 注记见 core/pyproject.toml coverage 段（实测基线下取整；本地
      # addopts 不加 --cov——门禁只在 CI 面）。server/webapp 挂沿册。

  server:
    name: 服务层质量
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: 安装依赖（server/uv.lock 入库——ENG1 遗留收口 SERVER D6：frozen 安装不重解析）
        run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy
      - name: import-linter 架构契约（UF-13 机器强制 CI 化——ENG2 D1）
        run: uv run lint-imports
      - run: uv run pytest
      - name: OpenAPI 契约零漂移（重生成与入库件字节比对——ENG2 D1/R1-a）
        run: |
          uv run python -m waterprint_server.dump_openapi --out /tmp/wp-openapi-drift.json
          uv run python - <<'PY'
          from pathlib import Path

          fresh = Path("/tmp/wp-openapi-drift.json").read_bytes()
          stored = Path("../api-contracts/openapi.json").read_bytes()
          if fresh != stored:
              raise SystemExit(
                  "OpenAPI 契约漂移：重生成与入库件不一致，请经 dump_openapi 重新入库"
              )
          print(f"[OK] OpenAPI 契约零漂移（{len(fresh)} 字节逐字节一致）")
          PY

  webapp:
    name: 前端构建（类型检查）
    runs-on: ubuntu-latest
    env:
      # 仓库 .npmrc 的 npmmirror 是本机网络对策；CI 海外 runner 走官方源
      npm_config_registry: "https://registry.npmjs.org"
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v7
      # package-manager-cache: false——setup-node v5 默认 true：自动检测
      # pnpm-lock.yaml 即要求 pnpm 在 PATH（corepack enable 在后续 run 步
      # 才生效）→ 步骤内「Unable to locate executable file: pnpm」失败
      # （ENG4 S14 升版引入，v4 语义=不缓存恢复；CI 缓存优化归 M4 部署批统筹）
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - run: pnpm install
      - run: pnpm orval
      - run: pnpm build
      - run: pnpm test

  benchmarks:
    name: 性能基准（§18.1 预算 5s 不放宽）
    needs: [gates, core]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: 安装依赖（core/uv.lock 入库——frozen 安装不重解析；dev 组含 pytest-benchmark）
        run: uv sync --frozen
      - name: Pytest 基准（慢机敏感性：CI 偶发红按重跑复核定性——非放宽，交接在册口径）
        run: uv run pytest tests/benchmark -q

  # ENG5 D9（裁决④a——M4 挂账「镜像构建 CI 化」兑现）：双镜像可构建性
  # 验证，不推 registry。核查面（质量门 §4-2）：本 job 仅用 checkout@v7
  # （仓内既有六 job 同版，无默认值变化面）+docker CLI（runner 预装，
  # 零新 action）；镜像源 aliyun/npmmirror 在 Dockerfile ENV 内（本批零
  # deploy/ 触碰——海外 runner 对公网镜像可达性即本 job 验证目标，本地
  # 国内面 M4 已验）。
  deploy-build:
    name: 镜像构建（deploy/ 可构建性验证）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: 构建 server 镜像（上下文=仓库根：uv path 依赖需 core 同场）
        run: docker build -f deploy/Dockerfile.server .
      - name: 构建 webapp 镜像（orval 需 api-contracts/openapi.json 同场）
        run: docker build -f deploy/Dockerfile.webapp .

  # WP3（外审整改#5 L4）+R2-B 门禁化收口：依赖审计。core/server=uv export
  # 冻结锁定面 → uvx pip-audit@2.10.1（工具临时化零新项目依赖，uvx 随
  # setup-uv 自带；版本 pin=本地实测 2.10.1，CI 行为与 72f0beb 绿灯观测
  # 对齐）；webapp=pnpm audit --prod。R2-B 起阻断：审计红即 fail run
  # （continue-on-error 已移除——外审整改#5 残留收口）。不设 needs
  # （R2-B 裁决落地）：门禁化后审计与代码门禁仍无逻辑依赖——审计对象=
  # lock 冻结面非代码行为，并行启动最快出红；R 轮审阅反对再挂。
  dep-audit:
    name: 依赖审计（阻断面）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.13"
      - name: core 依赖审计（uv.lock 冻结面导出 → pip-audit）
        working-directory: core
        run: |
          uv export --frozen --no-dev --no-emit-project -o /tmp/core-req.txt
          uvx pip-audit@2.10.1 -r /tmp/core-req.txt
      - name: server 依赖审计（同构；waterprint-core 为 path 依赖不在 PyPI——剔除后审计其余锁定面）
        working-directory: server
        run: |
          uv export --frozen --no-dev --no-emit-project --no-emit-package waterprint-core -o /tmp/server-req.txt
          uvx pip-audit@2.10.1 -r /tmp/server-req.txt
      # webapp 面沿用 webapp job 的 setup 形态（package-manager-cache: false
      # 原因见彼处注记；registry 覆盖同因——仓库 .npmrc 的 npmmirror 是本机
      # 网络对策，CI 海外 runner 审计走官方源）
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: corepack enable
      - name: webapp 依赖审计（生产依赖面）
        working-directory: webapp
        env:
          npm_config_registry: "https://registry.npmjs.org"
        run: pnpm audit --prod
