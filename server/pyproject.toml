[project]
name = "waterprint-server"
version = "0.1.0"
description = "WaterPrint FastAPI 服务层：HTTP 编排（routers→services→jobs），业务全部在 core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "structlog>=24.1",
    "pydantic-settings>=2.4",
    "waterprint-core",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
waterprint-core = { path = "../core" }

# 镜像源（同 core/pyproject.toml 注释）
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waterprint_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# importlib 模式：routers 与 services 存在同名镜像测试（test_projects 等）
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "SLF001", "RUF"]
# 全角中文标点是本项目文档与注释的规范写法，非歧义字符（同 core 策略，T0.2）
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 40
max-args = 5
max-branches = 12

[tool.ruff.lint.per-file-ignores]
# 锁定测试区工具债豁免（同 core T0.2 口径，AGENTS.md §7：server/tests/ 只读锁定）：
# PLC0415×3（tests/jobs/test_worker.py 局部导入）等存量样式债待人类解锁流程修复
"tests/**" = ["PLR2004", "PLC0415", "RUF043", "B017", "E501", "B009", "UP037", "F401", "F541", "F821", "RUF017", "RUF059"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["waterprint_server"]
plugins = ["pydantic.mypy"]
