[project]
name = "waterprint-server"
version = "0.1.0"
description = "WaterPrint FastAPI 服务层：HTTP 编排（routers→services→jobs），业务全部在 core"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "structlog>=24.1",
    "pydantic-settings>=2.4",
    "waterprint-core",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    # core 源码类型面（server mypy 经 mypy_path 直查 ../core——同 core
    # dev 组口径，缺 stub 会令 core 文件在 server 侧误报/漏报）
    "types-pyyaml>=6.0",
    "types-openpyxl>=3.1",
]

[tool.uv.sources]
waterprint-core = { path = "../core" }

# 镜像源（同 core/pyproject.toml 注释）
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waterprint_server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# importlib 模式：routers 与 services 存在同名镜像测试（test_projects 等）
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "PL", "SLF001", "RUF"]
# 全角中文标点是本项目文档与注释的规范写法，非歧义字符（同 core 策略，T0.2）
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-statements = 40
max-args = 5
max-branches = 12

[tool.ruff.lint.per-file-ignores]
# 锁定测试区工具债豁免（同 core T0.2 口径，AGENTS.md §7：server/tests/ 只读锁定）：
# PLC0415×3（tests/jobs/test_worker.py 局部导入）等存量样式债待人类解锁流程修复
"tests/**" = ["PLR2004", "PLC0415", "RUF043", "B017", "E501", "B009", "UP037", "F401", "F541", "F821", "RUF017", "RUF059"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["waterprint_server"]
plugins = ["pydantic.mypy"]
# waterprint-core 包未携带 py.typed（core 侧自身 mypy 直查源码无此需求）；
# 经源码路径解析获得完整类型面（等效 core 侧检查口径），禁 ignore_missing
# （Any 泄漏会击穿 strict 的 Returning Any 防线）。
# R1-4③（AU-7 追认注记 2026-08-26）：mypy_path 与 dev 组 types-pyyaml/
# types-openpyxl/import-linter 三件为 mypy strict/lint-imports 功能必需的
# 白名单字面越界（简报 §2 server/pyproject 动作=D7 importlinter 节）——
# 已登记越白名单追认（UF-46/47 临置注记见 docs/undefined-features-register.md）。
mypy_path = "../core"

# ── UF-13 收口（SERVER D7 2026-08-26）：server 层 import-linter ──
# 分层铁律（§13.4）：routers→services→jobs→settings；router 禁业务、
# service 禁 import fastapi、jobs 只做序列化+调 core。
[tool.importlinter]
# 双根（SERVER D7）：waterprint 为外部真源包——禁其子包（solution/
# trace/graph/units_lib/registry/project）须以根包身份纳入契约域
# （import-linter 外部包子包不可作 forbidden 模块，工具链实测）。
root_packages = ["waterprint_server", "waterprint"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "服务层分层只许向下（main→routers→services→jobs→settings）"
type = "layers"
layers = [
    "waterprint_server.main",
    "waterprint_server.routers",
    "waterprint_server.services",
    "waterprint_server.jobs",
    "waterprint_server.settings",
]

# UF-33"不直连 L3/L1/L4.project"机器强制：core 调用白名单只
# waterprint.app 与 waterprint.contracts（SENS-B 2026-08-23；SERVER D7）。
# allow_indirect_imports=true=直查口径：经 waterprint.app 的合法转发链
# （app→solution/trace/graph/…）不构成违规——pint 契约同款意图条款。
[[tool.importlinter.contracts]]
name = "core 调用只经 waterprint.app 与 waterprint.contracts（UF-33 单入口）"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["waterprint_server"]
forbidden_modules = [
    "waterprint.solution",
    "waterprint.trace",
    "waterprint.graph",
    "waterprint.units_lib",
    "waterprint.registry",
    "waterprint.project",
]
