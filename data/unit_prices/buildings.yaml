# 建筑工程单价（土建族）——COST1 概算段一迁移自旧系统
# Graduation_design/ddesign_tool/src/models/cost/unit_prices.py "二、土建综合单价"节
# （散常量 6 条 + CIVIL dict 8 键 = 14 个数据点，归并为 11 条）。
# 合并对照（同名同单位同值三对）：
#   EARTHWORK 35.0 元/m3 ≡ CIVIL.excavation 35.0 元/m3 → earthwork
#   CUSHION 550.0 元/m3 ≡ CIVIL.c15_pad 550.0 元/m3 → cushion_c15
#   CONCRETE 950.0 元/m3（底板面）≡ CIVIL.c30_floor 950.0 元/m3 → concrete_c30_floor
# 分立两键（非重复）：rebar_t 5800 元/t 与 CIVIL.rebar 5.8 元/kg（单位不同）；
#   formwork 与 formwork_wall、waterproof 与 waterproof_inner（语义分立）。
# 族头注（照旧实标）：2019 地方定额第五册（2024 年调整：材料+15%，人工+30%）。

