# 管网域引擎/安全面假设（6 键，NET2 段二批）：前四条数值逐字取自已追认
# 手算表 network_manning.md NM-F4 行（RATIFY4），后两条 §18 护栏（起草）。
- key: network.solve.tolerance
  default: "1e-10"
  dim: FLOW
  source: "docs/norms/network_manning.md NM-F4（RATIFY4 追认 2026-08-28）：二分容差 |ΔQ|≤1e-10 m³/s（手算誊录精度 1e-4）"
  note: "solve_depth 停机判据（m³/s）——manning.py 消费"
  tuning_impact:
    direction: "收紧→迭代增多，放宽→早停假根风险"
    constraint_keys: []
- key: network.solve.max_iterations
  default: "200"
  dim: DIMENSIONLESS
  source: "docs/norms/network_manning.md NM-F4（RATIFY4 追认 2026-08-28）：最大 200 轮"
  note: "solve_depth 二分轮数上限——超限抛 NetworkHydraulicsError（禁静默截断）"
  tuning_impact:
    direction: "增大→更耐慢收敛，减小→不收敛误报增多"
    constraint_keys: []
- key: network.solve.depth_min
  default: "0.02"
  dim: DIMENSIONLESS
  source: "docs/norms/network_manning.md NM-F4（RATIFY4 追认 2026-08-28）：二分区间 [0.02, 0.998] 下端"
  note: "solve_depth 区间下端（h/D）"
  tuning_impact:
    direction: "抬高→浅流无解增多，降低→更稳"
    constraint_keys: []
- key: network.solve.depth_max
  default: "0.998"
  dim: DIMENSIONLESS
  source: "docs/norms/network_manning.md NM-F4（RATIFY4 追认 2026-08-28）：二分区间 [0.02, 0.998] 上端"
  note: "solve_depth 区间上端（h/D）"
  tuning_impact:
    direction: "抬升→近满流可解，降低→误报无解"
    constraint_keys: []
- key: network.excel.max_rows
  default: "5000"
  dim: DIMENSIONLESS
  source: "重写计划 §18 Excel zip 炸弹护栏（工程惯例类起草，待追认）——市政管网管段数百~数千段量级档"
  note: "read_network_excel 行数上限——超限抛 NetworkExcelError（只读解析前置防弹）"
  tuning_impact:
    direction: "增大→耗时与内存上升，减小→护栏更严"
    constraint_keys: []
- key: network.excel.max_file_bytes
  default: "10485760"
  dim: DIMENSIONLESS
  source: "重写计划 §18 Excel zip 炸弹护栏（工程惯例类起草，待追认）——10 MiB 档"
  note: "read_network_excel 文件大小上限（字节）——超限拒读"
  tuning_impact:
    direction: "增大→解压风险上升，减小→护栏更严"
    constraint_keys: []
