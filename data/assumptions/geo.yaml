# 高程/几何域假设（10 键）：elevation 9（DRAFT 批 D7 起草——壁厚/埋深告警/
# 跌水阈值/损失公式经验系数/提升管路概算几何）+geometry 1（三维池列间距）。
# 数据策略 v2 工程常用范围口径——AI 起草待领域专家追认；出处标记仅三类合法。
- key: elevation.wall_thickness
  default: "0.3"
  dim: LENGTH
  source: "《给水排水设计手册（第 5 册 城镇排水）》水池构造（工程常用 0.2~0.4 m 档中值，待追认）"
  note: "钢筋混凝土水池壁厚概算默认（m）——elevation 埋深与三维池壁图元消费"
  tuning_impact:
    direction: "增大壁厚→结构占用与造价上升，减小→配筋与抗渗压力上升"
    constraint_keys: []
- key: elevation.bury_depth.max
  default: "6.0"
  dim: LENGTH
  source: "《给水排水设计手册（第 5 册 城镇排水）》构筑物埋深工程常用上限（起草，待追认）"
  note: "池底埋深告警阈值（m）——build_profile 超限产生 Warning（留用户决策）"
  tuning_impact:
    direction: "增大阈值→放深埋深接受度，减小→更早告警"
    constraint_keys: []
- key: elevation.drop_threshold
  default: "1.0"
  dim: LENGTH
  source: "重写计划 §14.2 跌水与提升行（'跌水 >1m 提示'口径）"
  note: "水面衔接跌水提示阈值（m）——evaluate_pumping 超限生成 drop_warnings"
  tuning_impact:
    direction: "增大阈值→仅更陡跌水告警，减小→更早提示消能需求"
    constraint_keys: []
- key: elevation.losses.friction_lambda
  default: "0.025"
  dim: DIMENSIONLESS
  source: "《给水排水设计手册（第 5 册 城镇排水）》管道水力计算（达西 λ 0.02~0.03 档中值，待追认）"
  note: "沿程损失公式 EL-F1 的 λ 系数（无量纲）——losses.py 经 assumption() 取值，禁另抄"
  tuning_impact:
    direction: "增大 λ→损失与泵扬程上升，减小→偏乐观"
    constraint_keys: []
- key: elevation.losses.gravity
  default: "9.81"
  dim: DIMENSIONLESS
  source: "《给水排水设计手册（第 5 册 城镇排水）》水力计算重力加速度工程口径 9.81 m/s²"
  note: "损失公式族（EL-F1/F2/F4）速度水头分母 g（DIMENSIONLESS 裸值——单位随公式符号）"
  tuning_impact:
    direction: "工程口径固定值，不调节（登记仅为公式符号单一真源）"
    constraint_keys: []
- key: elevation.losses.weir_coefficient
  default: "1.86"
  dim: DIMENSIONLESS
  source: "《给水排水设计手册（第 3 册 城镇给水）》矩形薄壁堰流量系数 1.86（Q=m·b·h^1.5，待追认）"
  note: "堰流损失公式 EL-F3 的 m 系数（m^(3/2)/s 口径，DIMENSIONLESS 裸值登记）"
  tuning_impact:
    direction: "增大系数→同流量堰上水头下降，减小→偏保守"
    constraint_keys: []
- key: elevation.losses.orifice_coefficient
  default: "0.62"
  dim: DIMENSIONLESS
  source: "《给水排水设计手册（第 5 册 城镇排水）》孔口/管嘴出流流量系数 0.62（工程常用，待追认）"
  note: "孔口损失公式 EL-F4 的 μ 系数（无量纲）"
  tuning_impact:
    direction: "增大系数→同流量孔口损失下降，减小→偏保守"
    constraint_keys: []
- key: elevation.pump.pipe_length
  default: "100.0"
  dim: LENGTH
  source: "《给水排水设计手册（第 5 册 城镇排水）》泵站出水管概算管长工程常用档（起草，待追认）"
  note: "evaluate_pumping 提升管路损失概算管长（m）——实长归设计输入，M5 管线批接线"
  tuning_impact:
    direction: "增大管长→管路损失与总扬程上升"
    constraint_keys: []
- key: elevation.pump.pipe_diameter
  default: "0.5"
  dim: LENGTH
  source: "《给水排水设计手册（第 5 册 城镇排水）》泵站出水管概算管径工程常用档（起草，待追认）"
  note: "evaluate_pumping 提升管路损失概算管径（m）——设计输入接线前概算占位"
  tuning_impact:
    direction: "增大管径→流速与损失下降但造价上升"
    constraint_keys: []
- key: geometry.pool.spacing
  default: "3.0"
  dim: LENGTH
  source: "《给水排水设计手册（第 5 册 城镇排水）》并联池组检修通道/列间距工程常用档（待追认）"
  note: "三维并联池组排布列间距（m）——pools.py 消费，节点标注来源键"
  tuning_impact:
    direction: "增大间距→占地与连接管长上升，检修空间改善"
    constraint_keys: []
