# 状态：M1 草案（用户授权起草，领域专家签字后生效）。
# 键形态：factor.<unit>.<quantity>；粗/细格栅共用常数以 factor.screen.* 命名
#   （旧系统 _BarScreenBase 基类共用实现，值完全相同，不按单元重复建条目）。
# 全部数值为旧系统实际使用的基线值；正式依据待核对 GB 50014-2021 /
# 给水排水设计手册（草案）。带类系数拆 .min/.max 两键（多档=多键）。

