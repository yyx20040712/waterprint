# WaterPrint 双容器部署（server + webapp/nginx）。
# 一条命令（在仓库根执行——-f 为仓库根相对路径）：
#   docker compose -f deploy/compose.yml up -d --build
# 上下文=仓库根（见两个 Dockerfile 头注——core path 依赖/orval 契约输入）。
name: waterprint

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: waterprint-server:local
    container_name: waterprint-server
    volumes:
      # 项目与导出持久化（升级重建容器数据不丢；down -v 才会删卷）
      - wp-projects:/app/projects
      - wp-exports:/app/exports
    # WP1 安全收口：不发布 ports——8000 不出容器网桥，nginx（webapp）=唯一
    # 入口（24 端点零鉴权，暴露即全权；调试可 docker compose exec 进容器探）。
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/projects', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  webapp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.webapp
    image: waterprint-webapp:local
    container_name: waterprint-webapp
    ports:
      - "8080:80" # 入口：http://localhost:8080（/api 经 nginx 反代 server:8000）
    depends_on:
      server:
        condition: service_healthy
    restart: unless-stopped

volumes:
  wp-projects:
  wp-exports:
