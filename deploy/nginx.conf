# WaterPrint 前端反代（nginx:alpine conf.d 片段）。
# 语义对齐 vite dev 代理（webapp/vite.config.ts）：/api → 计算服务；
# SPA 前端路由 fallback（try_files → index.html）。

# 访问日志脱敏（R2-A 终裁 R-4，批2 落地）：不记 $args——入口 ？token=
# （SSE 认证查询通道，EventSource 无法自定义头）不得进访问日志。
# $request 整串（含查询串）替换为 "$request_method $uri $server_protocol"
# （$uri 不含查询串）；其余字段沿 combined 形态。server 级 access_log 统一
# 继承（/ 与 /api/ 两 location 不拆分不加定制——拆 events 独立 location
# 需复制 proxy 配置面，终裁明裁风险大）。
log_format waterprint '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $uri $server_protocol" '
                      '$status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # R-4：server 级统一继承 waterprint 脱敏格式（两 location 不另配）
    access_log /dev/stdout waterprint;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资产指纹文件名（vite build 产 assets/*.hash.js）：一年长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://waterprint-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（/api/events）：禁缓冲（服务端亦下发 X-Accel-Buffering: no——双保险）；
        # 计算任务长连接读超时放宽（默认 60s 会掐断慢计算轮询/长事件流）
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback：客户端路由刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
