# WaterPrint 前端反代（nginx:alpine conf.d 片段）。
# 语义对齐 vite dev 代理（webapp/vite.config.ts）：/api → 计算服务；
# SPA 前端路由 fallback（try_files → index.html）。
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资产指纹文件名（vite build 产 assets/*.hash.js）：一年长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://waterprint-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（/api/events）：禁缓冲（服务端亦下发 X-Accel-Buffering: no——双保险）；
        # 计算任务长连接读超时放宽（默认 60s 会掐断慢计算轮询/长事件流）
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback：客户端路由刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
