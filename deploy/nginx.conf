# WaterPrint 前端反代（nginx:alpine conf.d 片段）。
# 语义对齐 vite dev 代理（webapp/vite.config.ts）：/api → 计算服务；
# SPA 前端路由 fallback（try_files → index.html）。

# 访问日志脱敏（R2-A 终裁 R-4，批2 落地）：不记 $args——入口 ？token=
# （SSE 认证查询通道，EventSource 无法自定义头）不得进访问日志。
# IDLE-Q4 G1-05 评估落地（2026-09-02）：原第三段 $uri 系内部重定向后的
# 规范化 URI——SPA fallback（try_files）时深链接刷新一律记 /index.html
# 原始路径丢失；改 $request_uri 经 map 剥 ？ 及查询串（原始请求串未经
# 重写——保真+脱敏等价：不含查询串，token 面等价安全）。其余字段沿
# combined 形态；server 级 access_log 统一继承（/ 与 /api/ 两 location
# 不拆分不加定制——拆 events 独立 location 需复制 proxy 配置面，终裁
# 明裁风险大）。
map $request_uri $request_path {
    ~^(?<path_no_args>[^?]*) $path_no_args;
}
log_format waterprint '$remote_addr - $remote_user [$time_local] '
                      '"$request_method $request_path $server_protocol" '
                      '$status $body_bytes_sent '
                      '"$http_referer" "$http_user_agent"';

server {
    listen 80;
    server_name _;

    # R-4：server 级统一继承 waterprint 脱敏格式（两 location 不另配）
    access_log /dev/stdout waterprint;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资产指纹文件名（vite build 产 assets/*.hash.js）：一年长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://waterprint-server:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE（/api/events）：禁缓冲（服务端亦下发 X-Accel-Buffering: no——双保险）；
        # 计算任务长连接读超时放宽（默认 60s 会掐断慢计算轮询/长事件流）
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback：客户端路由刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
